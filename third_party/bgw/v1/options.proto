// 本地占位：公司 gateway（bgw）方法注解的最小定义，只为让本仓库能独立编译与生成代码。
//
// 字段与枚举名取自公司 gateway 的用法示例（path / http_method / filters，HTTP_METHOD_POST，
// FILTER_BIZ_LIMITER_V2）。接入正式环境时，用公司 bgw 仓库中的定义替换本文件
// （import 路径 "bgw/v1/options.proto" 与 option 名 bgw.v1.method_options 保持一致即可，
// workbench.proto 无需改动）。
syntax = "proto3";

package bgw.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/alex2025-sh/ai-workbench/third_party/bgw/v1;bgwv1";

enum HttpMethod {
  HTTP_METHOD_UNSPECIFIED = 0;
  HTTP_METHOD_GET = 1;
  HTTP_METHOD_POST = 2;
  HTTP_METHOD_PUT = 3;
  HTTP_METHOD_DELETE = 4;
}

enum FilterName {
  FILTER_UNSPECIFIED = 0;
  FILTER_BIZ_LIMITER_V2 = 1;
}

message Filter {
  FilterName name = 1;
  string args = 2;
}

message MethodOption {
  string path = 1;
  HttpMethod http_method = 2;
  repeated Filter filters = 3;
}

extend google.protobuf.MethodOptions {
  MethodOption method_options = 51001;
}
