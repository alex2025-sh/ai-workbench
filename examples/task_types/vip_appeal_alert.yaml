# VIP 工单提醒：VIP 用户的风控工单进入待审核后通知 RM；提交 48 小时后仍未审核完成，再提醒一次；
# 7 天后仍未完成，升级给 VIP 客服组长。
#
# 工单在中途审核完成时，扫描发现状态变化（close_when），立即取消 run、任务以 auto_closed 完结，不必等到下一个检查点。
#
# 一期没有前端，这份 YAML 由命令行转成 JSON 后调用 SaveTaskTypeDraft 发布，前端上线后提交的是同一种 JSON。
# 结构定义见 api/schema/task_type.schema.json。
#
# 数据来源目前是 mock：appeal 表结构见 deploy/mock/appeal.sql，「待审核」暂按 appeal_status = COMMITED、
# VIP 暂按 vip_level > 0 处理，业务口径确认后只需修改 sources 和 condition。

key: vip_appeal_alert
namespace: cs_vip
name: VIP 工单提醒
description: >-
  VIP 用户的风控工单（appeal）提交后需要尽快审核。任务提醒 VIP 的专属 RM 跟进，
  超过 48 小时未审核完成再次提醒，超过 7 天升级给 VIP 客服组长。
default_priority: P1

schema:
  type: object
  required: [appeal_id, uid, appeal_status, commit_time_ms]
  properties:
    appeal_id:      { type: string, title: 工单号 }
    appeal_type:    { type: string, title: 工单类型 }
    appeal_status:
      type: string
      title: 工单状态
      enum: [PENDING, COMMITED, REJECTED, PASS, REFUSE, DISUSED]
      x-enum-labels:
        PENDING: 待提交
        COMMITED: 已提交待审核
        REJECTED: 被驳回
        PASS: 审核通过
        REFUSE: 被拒且不可再次提交
        DISUSED: 废弃
    uid:            { type: string, title: 用户 UID, x-pii: mask_middle }
    vip_level:      { type: integer, title: VIP 等级 }
    vip_label_type: { type: string, title: VIP 标签 }
    biz_code:       { type: string, title: 业务类型 }
    order_amount:   { type: string, title: 订单金额, x-format: money }
    case_group:     { type: string, title: Case 分组 }
    reviewer:       { type: string, title: 审核人 }
    commit_time_ms: { type: integer, title: 提交时间, x-format: datetime }

sources:
  - id: scan_appeal
    kind: cron
    schedule: "*/1 * * * *"
    timezone: Asia/Shanghai
    skill: appeal.scan_vip            # 内置 skill：按 (updated_at, id) 增量扫描 appeal 表（读从库）
    input: { batch_size: 200 }
    filter: record.vip_level > 0 && record.appeal_status == "COMMITED"
    close_when: record.appeal_status != "COMMITED"   # 工单离开待审核：取消提醒，任务自动完结
    mapping:
      appeal_id: record.appeal_id
      appeal_type: record.appeal_type
      appeal_status: record.appeal_status
      uid: string(record.uid)
      vip_level: record.vip_level
      vip_label_type: record.vip_label_type
      biz_code: record.biz_code
      order_amount: record.order_amount
      case_group: record.case_group
      reviewer: record.reviewer
      commit_time_ms: record.commit_time * 1000

dedup_key: "{{ payload.appeal_id }}"

views:
  rm_card:
    title: "VIP 工单待审核：{{ payload.appeal_id }}"
    color: blue
    summary: "VIP{{ payload.vip_level }} 用户的工单已提交，请跟进审核进度。"
    fields:
      - { value: "{{ payload.appeal_type }}", label: 工单类型 }
      - { value: "{{ payload.uid }}" , label: 用户 UID }
      - { value: "{{ payload.order_amount }}", label: 订单金额 }
      - { value: "{{ payload.case_group }}", label: Case 分组 }
  rm_remind_card:
    title: "VIP 工单已等待 48 小时：{{ payload.appeal_id }}"
    color: orange
    fields:
      - { value: "{{ payload.appeal_type }}", label: 工单类型 }
      - { value: "{{ payload.reviewer }}", label: 审核人 }
  lead_card:
    title: "VIP 工单超过 7 天未完成：{{ payload.appeal_id }}"
    color: red
    fields:
      - { value: "{{ payload.appeal_type }}", label: 工单类型 }
      - { value: "{{ payload.reviewer }}", label: 审核人 }
      - { value: "{{ task.assignee }}", label: 原 RM }

view: rm_card
assignment:
  resolvers:
    - { type: relation, relation: vip_rm, subject: payload.uid }   # VIP uid → RM email（接口未定，先 mock）
  filters: [active]
  fallback: { group: vip_cs_leads, strategy: claim }

workflow:
  nodes:
    - { id: start, type: trigger }

    - id: notify_rm                   # 不写 view / to：沿用任务类型默认（rm_card，按 VIP→RM 关系分配）
      type: lark_card

    - id: wait_48h
      type: timer
      config: { after: 48h, anchor: payload.commit_time_ms }
    - id: check_48h
      type: skill_call
      config:
        skill: appeal.get_status
        input: { appeal_id: "{{ payload.appeal_id }}" }
    - id: pending_48h
      type: condition
      config:
        branches:
          - { port: pending, when: nodes.check_48h.output.appeal_status == "COMMITED" }
    - id: remind_rm
      type: lark_card
      config: { view: rm_remind_card }

    - id: wait_7d
      type: timer
      config: { after: 7d, anchor: payload.commit_time_ms }
    - id: check_7d
      type: skill_call
      config:
        skill: appeal.get_status
        input: { appeal_id: "{{ payload.appeal_id }}" }
    - id: pending_7d
      type: condition
      config:
        branches:
          - { port: pending, when: nodes.check_7d.output.appeal_status == "COMMITED" }
    - id: escalate
      type: human_choice
      config:
        view: lead_card
        assignment:
          resolvers: [{ type: group, group: vip_cs_leads }]
          strategy: claim
        options:
          - { key: handled, label: 已处理, style: primary }
          - { key: snooze, label: 明天再提醒, snooze: 24h }

    - { id: done, type: end, config: { resolution: reviewed } }
    - { id: escalated, type: end, config: { resolution: escalated } }

  edges:
    - { id: e1,  from: start,       port: next,    to: notify_rm }
    - { id: e2,  from: notify_rm,   port: next,    to: wait_48h }
    - { id: e3,  from: wait_48h,    port: next,    to: check_48h }
    - { id: e4,  from: check_48h,   port: next,    to: pending_48h }
    - { id: e5,  from: pending_48h, port: pending, to: remind_rm }
    - { id: e6,  from: pending_48h, port: default, to: done }
    - { id: e7,  from: remind_rm,   port: next,    to: wait_7d }
    - { id: e8,  from: wait_7d,     port: next,    to: check_7d }
    - { id: e9,  from: check_7d,    port: next,    to: pending_7d }
    - { id: e10, from: pending_7d,  port: pending, to: escalate }
    - { id: e11, from: pending_7d,  port: default, to: done }
    - { id: e12, from: escalate,    port: handled, to: escalated }
