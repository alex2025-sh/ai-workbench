# VIP 工单超过 7 天：提交超过 7 天仍未审核完成，交给 VIP 审核小组，由组长分配给组员处理。
key: vip_appeal_7d
namespace: cs_vip
name: VIP 工单超过 7 天
description: VIP 工单提交超过 7 天仍未审核完成，由 VIP 审核小组组长分配处理。
priority: P0

source:
  kind: sql
  datasource: appeal_ro
  schedule: "*/1 * * * *"
  query: |
    select concat(appeal_id, ':', commit_time) as `key`,
           appeal_id, appeal_type, cast(uid as char) as uid, vip_level, order_amount, reviewer, commit_time
    from appeal
    where appeal_status = 'COMMITED' and vip_level > 0
      and commit_time < unix_timestamp() - 7 * 86400

fields:
  - { name: appeal_id, label: 工单号 }
  - { name: appeal_type, label: 工单类型 }
  - { name: uid, label: 用户 UID, pii: mask_middle }
  - { name: vip_level, label: VIP 等级, type: number }
  - { name: order_amount, label: 订单金额, type: money }
  - { name: reviewer, label: 审核人 }
  - { name: commit_time, label: 提交时间, type: datetime }

card:
  title: "VIP 工单超过 7 天未完成：{appeal_id}"
  fields: [appeal_type, reviewer, order_amount, commit_time]

nodes:
  - id: review
    name: VIP 审核小组
    assignee: { kind: team, team: vip_review, mode: assign }
    actions: [close, no_response, snooze, link]
    link: { label: 打开工单, url: "https://risk.example.com/appeal/{appeal_id}" }
    lark: true
