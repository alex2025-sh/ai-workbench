name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WB_TEST_MYSQL: "root:@tcp(127.0.0.1:3306)/"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: gofmt
        run: test -z "$(gofmt -s -l .)" || (gofmt -s -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...

  # 校验 .proto 与 SQL 能被 goctl 正确生成并编译通过；rpc 生成结果不提交，model 已提交，必须与 SQL 一致
  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: install protoc, plugins and goctl
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          go install github.com/zeromicro/go-zero/tools/goctl@v1.10.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: generate
        run: make gen
      - name: committed models are up to date
        run: git diff --exit-code -- internal/model
      - name: build generated code
        run: go build ./...
