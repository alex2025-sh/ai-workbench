  // 转派（只改变处理人，状态不变）
  rpc Reassign(ReassignReq) returns (TaskView) {
    option (bgw.v1.method_options) = {
      path       : "/ai_workbench/api/v1/task/reassign";
      http_method: HTTP_METHOD_POST;
      filters    : [
        {
          name: FILTER_BIZ_LIMITER_V2;
          args: '--rules=[{"rate":20, "ip":true, "path":true}, {"rate":100, "path":true}]'
        }
      ];
    };
  }
}

