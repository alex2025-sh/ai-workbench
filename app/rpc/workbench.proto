// 变更集：审批与发布的单位；审批由公司审批平台完成
service ChangeSetService {
  // 把草稿打包为变更集，并对依赖闭包编译校验
  rpc CreateChangeSet(CreateChangeSetReq) returns (ChangeSet) {
    option (bgw.v1.method_options) = {
      path       : "/ai_workbench/api/v1/change_set/create";
      http_method: HTTP_METHOD_POST;
      filters    : [
        {
          name: FILTER_BIZ_LIMITER_V2;
          args: '--rules=[{"rate":20, "ip":true, "path":true}, {"rate":100, "path":true}]'
        }
      ];
    };
  }

  // 为共享组件的引用方一键生成升级草稿并加入变更集
  rpc AddDependentUpgrades(AddDependentUpgradesReq) returns (ChangeSet) {
    option (bgw.v1.method_options) = {
      path       : "/ai_workbench/api/v1/change_set/add_dependents";
      http_method: HTTP_METHOD_POST;
      filters    : [
        {
          name: FILTER_BIZ_LIMITER_V2;
          args: '--rules=[{"rate":20, "ip":true, "path":true}, {"rate":100, "path":true}]'
        }
      ];
    };
  }

  // 变更集详情
  rpc GetChangeSet(ChangeSetIdReq) returns (ChangeSet) {
    option (bgw.v1.method_options) = {
      path       : "/ai_workbench/api/v1/change_set/get";
      http_method: HTTP_METHOD_POST;
    };
  }

  // 变更集列表
  rpc ListChangeSets(ListChangeSetsReq) returns (ListChangeSetsResp) {
    option (bgw.v1.method_options) = {
      path       : "/ai_workbench/api/v1/change_set/list";
      http_method: HTTP_METHOD_POST;
    };
  }

  // 变更集内各项与其基础版本的差异（审批单链接到此）
  rpc DiffChangeSet(ChangeSetIdReq) returns (DiffChangeSetResp) {
    option (bgw.v1.method_options) = {
      path       : "/ai_workbench/api/v1/change_set/diff";
      http_method: HTTP_METHOD_POST;
    };
  }

  // 提交审批：快照草稿、锁定、在公司审批平台创建审批实例
  rpc SubmitChangeSet(ChangeSetIdReq) returns (SubmitChangeSetResp) {
    option (bgw.v1.method_options) = {
      path       : "/ai_workbench/api/v1/change_set/submit";
      http_method: HTTP_METHOD_POST;
      filters    : [
        {
          name: FILTER_BIZ_LIMITER_V2;
          args: '--rules=[{"rate":20, "ip":true, "path":true}, {"rate":100, "path":true}]'
        }
      ];
    };
  }

  // 撤回审批，草稿解锁
  rpc WithdrawChangeSet(ChangeSetIdReq) returns (ChangeSet) {
    option (bgw.v1.method_options) = {
      path       : "/ai_workbench/api/v1/change_set/withdraw";
      http_method: HTTP_METHOD_POST;
      filters    : [
        {
          name: FILTER_BIZ_LIMITER_V2;
          args: '--rules=[{"rate":20, "ip":true, "path":true}, {"rate":100, "path":true}]'
        }
      ];
    };
  }

  // 公司审批平台回调：通过则原子发布，驳回则退回草稿
  rpc OnApprovalResult(OnApprovalResultReq) returns (OnApprovalResultResp) {
    option (bgw.v1.method_options) = {
      path       : "/ai_workbench/api/v1/change_set/approval_callback";
      http_method: HTTP_METHOD_POST;
      filters    : [
        {
          name: FILTER_BIZ_LIMITER_V2;
          args: '--rules=[{"rate":200, "path":true}]'
        }
      ];
    };
  }

  // 下线某个版本；仍被引用的共享组件版本不能下线
  rpc RetireVersion(RetireVersionReq) returns (Empty) {
    option (bgw.v1.method_options) = {
      path       : "/ai_workbench/api/v1/config/version/retire";
      http_method: HTTP_METHOD_POST;
      filters    : [
        {
          name: FILTER_BIZ_LIMITER_V2;
          args: '--rules=[{"rate":20, "ip":true, "path":true}, {"rate":100, "path":true}]'
        }
      ];
    };
  }
}

