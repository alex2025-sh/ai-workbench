syntax = "proto3";

// AI Workbench 对外 gRPC 接口。前端与外部系统经公司 gateway 访问，gateway 负责 HTTP 与 gRPC 的转换、
// 认证与限流。设计见 docs/ai-task-platform.md「前后端交互」「接口清单」。
//
// 约定：
//   * 每个方法用 bgw.v1.method_options 声明 HTTP 路径，路径为 /ai_workbench/api/v1/<资源>/<动作>，统一 POST。
//   * 调用人身份由 gateway 写入 gRPC metadata，请求消息中不包含 actor / viewer 等身份字段。
//   * 接口级权限在 BSP 权限平台按方法配置。
//   * 业务 JSON（payload、body、dsl、report）用 bytes 承载 UTF-8 JSON，不用 google.protobuf.Struct，
//     避免数字变成 double 导致金额丢精度。
//   * 时间统一为 Unix 毫秒（int64），0 表示未设置。
package workbench.v1;

import "bgw/v1/options.proto";

option go_package = "./pb";


// 任务类型及其自有组件（schema、来源、workflow、自有卡片模板）
service TaskTypeService {
  // 新建任务类型并创建草稿
  rpc CreateTaskType(CreateTaskTypeReq) returns (CreateTaskTypeResp) {
    option (bgw.v1.method_options) = {
      path       : "/ai_workbench/api/v1/task_type/create";
      http_method: HTTP_METHOD_POST;
      filters    : [
        {
          name: FILTER_BIZ_LIMITER_V2;
          args: '--rules=[{"rate":20, "ip":true, "path":true}, {"rate":100, "path":true}]'
        }
      ];
    };
  }

  // 任务类型列表，按 namespace 筛选
  rpc ListTaskTypes(ListTaskTypesReq) returns (ListTaskTypesResp) {
    option (bgw.v1.method_options) = {
      path       : "/ai_workbench/api/v1/task_type/list";
      http_method: HTTP_METHOD_POST;
    };
  }

  // 获取已发布版本及其发布清单
  rpc GetTaskType(GetTaskTypeReq) returns (GetTaskTypeResp) {
    option (bgw.v1.method_options) = {
      path       : "/ai_workbench/api/v1/task_type/get";
      http_method: HTTP_METHOD_POST;
    };
  }

  // 获取草稿；没有时基于最新发布版本创建
  rpc GetTaskTypeDraft(TaskTypeKeyReq) returns (GetTaskTypeDraftResp) {
    option (bgw.v1.method_options) = {
      path       : "/ai_workbench/api/v1/task_type/draft/get";
      http_method: HTTP_METHOD_POST;
    };
  }

  // 保存草稿（revision 乐观锁）
  rpc SaveTaskTypeDraft(SaveTaskTypeDraftReq) returns (SaveTaskTypeDraftResp) {
    option (bgw.v1.method_options) = {
      path       : "/ai_workbench/api/v1/task_type/draft/save";
      http_method: HTTP_METHOD_POST;
      filters    : [
        {
          name: FILTER_BIZ_LIMITER_V2;
          args: '--rules=[{"rate":20, "ip":true, "path":true}, {"rate":100, "path":true}]'
        }
      ];
    };
  }

  // 丢弃草稿
  rpc DiscardTaskTypeDraft(DiscardDraftReq) returns (Empty) {
    option (bgw.v1.method_options) = {
      path       : "/ai_workbench/api/v1/task_type/draft/discard";
      http_method: HTTP_METHOD_POST;
      filters    : [
        {
          name: FILTER_BIZ_LIMITER_V2;
          args: '--rules=[{"rate":20, "ip":true, "path":true}, {"rate":100, "path":true}]'
        }
      ];
    };
  }

  // 对草稿及其依赖闭包完整编译校验
  rpc ValidateTaskTypeDraft(TaskTypeKeyReq) returns (ValidateResp) {
    option (bgw.v1.method_options) = {
      path       : "/ai_workbench/api/v1/task_type/draft/validate";
      http_method: HTTP_METHOD_POST;
    };
  }

  // 试运行：动作节点只记录不执行，虚拟时钟
  rpc DryRunTaskTypeDraft(DryRunTaskTypeDraftReq) returns (DryRunResp) {
    option (bgw.v1.method_options) = {
      path       : "/ai_workbench/api/v1/task_type/draft/dry_run";
      http_method: HTTP_METHOD_POST;
      filters    : [
        {
          name: FILTER_BIZ_LIMITER_V2;
          args: '--rules=[{"rate":20, "ip":true, "path":true}, {"rate":100, "path":true}]'
        }
      ];
    };
  }

  // 按 schema 生成或从历史任务取样例 payload
  rpc GenerateSamplePayload(GenerateSamplePayloadReq) returns (GenerateSamplePayloadResp) {
    option (bgw.v1.method_options) = {
      path       : "/ai_workbench/api/v1/task_type/sample_payload";
      http_method: HTTP_METHOD_POST;
    };
  }

  // 用样例数据预览卡片模板
  rpc PreviewView(PreviewViewReq) returns (PreviewViewResp) {
    option (bgw.v1.method_options) = {
      path       : "/ai_workbench/api/v1/task_type/view/preview";
      http_method: HTTP_METHOD_POST;
    };
  }

  // 试跑来源：cron 立即扫描一次，Kafka / API 用样例消息
  rpc TrialSource(TrialSourceReq) returns (TrialSourceResp) {
    option (bgw.v1.method_options) = {
      path       : "/ai_workbench/api/v1/task_type/source/trial";
      http_method: HTTP_METHOD_POST;
      filters    : [
        {
          name: FILTER_BIZ_LIMITER_V2;
          args: '--rules=[{"rate":20, "ip":true, "path":true}, {"rate":100, "path":true}]'
        }
      ];
    };
  }

  // 版本历史
  rpc ListTaskTypeVersions(TaskTypeKeyReq) returns (ListVersionsResp) {
    option (bgw.v1.method_options) = {
      path       : "/ai_workbench/api/v1/task_type/versions";
      http_method: HTTP_METHOD_POST;
    };
  }
}

