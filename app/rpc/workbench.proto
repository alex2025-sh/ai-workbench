syntax = "proto3";

// AI Workbench 对外 gRPC 接口。前端与外部系统经公司 gateway 访问，gateway 负责 HTTP 与 gRPC 的转换、
// 认证与限流。设计见 docs/ai-task-platform.md。
//
// 约定：
//   * 每个方法行尾注释给出 gateway 的 HTTP 路径（/byai_platform/api/v1/<资源>/<动作>，统一 POST）。
//     一期不引入 gateway 注解，接入 gateway 时再改为 bgw.v1.method_options。
//   * 调用人身份由 gateway 写入 gRPC metadata，请求消息中不包含 actor 等身份字段。
//   * 接口级权限在 BSP 权限平台按方法配置。
//   * 业务 JSON（任务类型、业务字段、查询结果）用 bytes 承载 UTF-8 JSON，不用 google.protobuf.Struct，
//     避免数字变成 double 导致金额丢精度。
//   * 时间统一为 Unix 毫秒（int64），0 表示未设置。
package workbench.v1;

option go_package = "./pb";

// 任务类型：草稿、校验、发布与已发布版本
service TaskTypeService {
  // 新建任务类型并创建草稿
  rpc CreateTaskType(CreateTaskTypeReq) returns (DraftResp); // POST /byai_platform/api/v1/task_type/create

  // 任务类型列表
  rpc ListTaskTypes(ListTaskTypesReq) returns (ListTaskTypesResp); // POST /byai_platform/api/v1/task_type/list

  // 已发布版本（version 为 0 取最新）与数据源状态
  rpc GetTaskType(GetTaskTypeReq) returns (GetTaskTypeResp); // POST /byai_platform/api/v1/task_type/get

  // 版本历史
  rpc ListTaskTypeVersions(TaskTypeKeyReq) returns (ListVersionsResp); // POST /byai_platform/api/v1/task_type/versions

  // 获取草稿；没有时基于最新发布版本创建
  rpc GetTaskTypeDraft(TaskTypeKeyReq) returns (DraftResp); // POST /byai_platform/api/v1/task_type/draft/get

  // 保存草稿（revision 乐观锁），返回校验问题
  rpc SaveTaskTypeDraft(SaveTaskTypeDraftReq) returns (SaveTaskTypeDraftResp); // POST /byai_platform/api/v1/task_type/draft/save

  // 丢弃草稿；尚未发布过的任务类型一并删除
  rpc DiscardTaskTypeDraft(TaskTypeKeyReq) returns (Empty); // POST /byai_platform/api/v1/task_type/draft/discard

  // 完整校验草稿（含数据源连接、业务关系是否存在）
  rpc ValidateTaskTypeDraft(TaskTypeKeyReq) returns (ValidateResp); // POST /byai_platform/api/v1/task_type/draft/validate

  // 发布草稿为新版本（需要 task_type.publish 权限；有问题时不发布）
  rpc PublishTaskTypeDraft(TaskTypeKeyReq) returns (PublishResp); // POST /byai_platform/api/v1/task_type/draft/publish

  // 试跑 SQL：在只读事务中执行，返回列与前 20 行；配置页据此生成字段
  rpc TrialSql(TrialSqlReq) returns (TrialSqlResp); // POST /byai_platform/api/v1/task_type/trial_sql

  // 用一行样例数据渲染卡片（未保存的草稿也可以预览）
  rpc PreviewCard(PreviewCardReq) returns (PreviewCardResp); // POST /byai_platform/api/v1/task_type/preview_card
}

// 任务工作台
service TaskService {
  // 任务列表：我的任务、我经手的
  rpc ListTasks(ListTasksReq) returns (ListTasksResp); // POST /byai_platform/api/v1/task/list

  // 任务详情：卡片、业务字段、节点链、历史，以及调用人可做的操作
  rpc GetTask(TaskIdReq) returns (TaskDetail); // POST /byai_platform/api/v1/task/get

  // 开始处理
  rpc StartProcessing(TaskIdReq) returns (TaskSummary); // POST /byai_platform/api/v1/task/start

  // 节点动作：close、no_response、snooze、escalate（link 在前端打开，不经过后端）
  rpc ActTask(ActTaskReq) returns (TaskSummary); // POST /byai_platform/api/v1/task/act

  // 转派（处理人或 task.admin）
  rpc Reassign(ReassignReq) returns (TaskSummary); // POST /byai_platform/api/v1/task/reassign

  // 调整优先级（处理人或 task.admin）
  rpc UpdatePriority(UpdatePriorityReq) returns (TaskSummary); // POST /byai_platform/api/v1/task/priority
}

// 配置页的下拉选项
service CatalogService {
  // 平台注册的只读数据源连接
  rpc ListDatasources(Empty) returns (NameList); // POST /byai_platform/api/v1/catalog/datasources
  // 可用的业务关系（如 vip_rm）
  rpc ListRelations(Empty) returns (NameList); // POST /byai_platform/api/v1/catalog/relations
}

// API 推送来源；Kafka 来源由平台消费固定 topic 后调用同一套逻辑
service IngestService {
  rpc Push(PushReq) returns (PushResp); // POST /byai_platform/api/v1/ingest/push
}

// ============================================================================
// 公共

message Empty {}

message PageReq {
  string cursor = 1;
  int32 page_size = 2;
}

message NameList {
  repeated string names = 1;
}

// 任务状态。proto3 枚举首值必须为 0，因此用 TASK_STATUS_UNSPECIFIED 占位；
// 存储与 Go 代码使用 internal/task.TaskStatus（-1/0/1/2/3），转换统一用 StatusToProto / StatusFromProto。
enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_UNASSIGNED = 1;  // 存储值 -1：保留（进入节点时总是直接分配给一个人）
  TASK_STATUS_PENDING = 2;     // 存储值 0
  TASK_STATUS_PROCESSING = 3;  // 存储值 1
  TASK_STATUS_SNOOZED = 4;     // 存储值 2
  TASK_STATUS_SOLVED = 5;      // 存储值 3，终态
}

// 任务优先级，数值越小越紧急；与存储值一致。
enum TaskPriority {
  TASK_PRIORITY_P0 = 0;
  TASK_PRIORITY_P1 = 1;
  TASK_PRIORITY_P2 = 2;
  TASK_PRIORITY_P3 = 3;
}

// 校验问题。path 是任务类型 JSON 中的路径（如 nodes.1.link），前端据此定位到表单项。
message Issue {
  string path = 1;
  string message = 2;
}

// ============================================================================
// 任务类型

message TaskTypeSummary {
  string key = 1;
  string namespace = 2;
  string name = 3;
  int32 latest_version = 4;  // 0 = 尚未发布
  bool has_draft = 5;
  int64 updated_at = 6;
  string source_kind = 7;    // 最新版本的数据源类型：sql / api / kafka
}

message VersionInfo {
  int32 version = 1;
  string content_hash = 2;
  string published_by = 3;
  int64 published_at = 4;
}

message CreateTaskTypeReq {
  string key = 1;
  string namespace = 2;
  string name = 3;
  string description = 4;
}

message ListTaskTypesReq {
  string keyword = 1;
  string namespace = 2;
}

message ListTaskTypesResp {
  repeated TaskTypeSummary items = 1;
}

message TaskTypeKeyReq {
  string key = 1;
}

message GetTaskTypeReq {
  string key = 1;
  int32 version = 2;  // 0 = 最新
}

// SQL 来源的调度状态
message SourceState {
  int64 next_run_at = 1;
  int64 last_run_at = 2;
  int32 last_rows = 3;
  int32 last_created = 4;
  int32 last_closed = 5;
  string last_error = 6;
}

message GetTaskTypeResp {
  TaskTypeSummary summary = 1;
  VersionInfo version = 2;
  bytes body_json = 3;
  SourceState source_state = 4;  // 只有 SQL 来源有
}

message ListVersionsResp {
  repeated VersionInfo items = 1;
}

message DraftResp {
  string key = 1;
  int32 base_version = 2;  // 0 = 尚未发布过
  int64 revision = 3;
  bytes body_json = 4;
  string updated_by = 5;
  repeated Issue issues = 6;
}

message SaveTaskTypeDraftReq {
  string key = 1;
  int64 revision = 2;
  bytes body_json = 3;
}

message SaveTaskTypeDraftResp {
  int64 revision = 1;
  repeated Issue issues = 2;
}

message ValidateResp {
  repeated Issue issues = 1;
}

message PublishResp {
  VersionInfo version = 1;
  repeated Issue issues = 2;  // 非空时没有发布
}

message TrialSqlReq {
  string datasource = 1;
  string query = 2;
}

message TrialSqlResp {
  repeated string columns = 1;  // 不含 key
  bytes rows_json = 2;          // [{"key": "...", "<列>": "..."}]，最多 20 行
  bool has_more = 3;
}

message PreviewCardReq {
  bytes body_json = 1;    // 任务类型 JSON（可以是未保存的草稿）
  string node_id = 2;     // 空 = 第一个节点
  string key = 3;
  bytes values_json = 4;  // 一行样例数据：字段名 → 值
}

message PreviewCardResp {
  Card card = 1;
  repeated Issue issues = 2;  // 任务类型有问题时卡片可能不完整
}

// ============================================================================
// 任务

message KV {
  string label = 1;
  string value = 2;
}

// 渲染后的卡片：工作台、任务详情与 Lark 共用同一份内容，已按字段的 pii 脱敏。
message Card {
  string title = 1;
  string node_name = 2;
  repeated KV fields = 3;
  KV link = 4;  // 节点启用 link 时的业务链接：label → url
}

// 调用人在当前节点可以执行的动作
message ActionOption {
  string key = 1;                // close / no_response / snooze / escalate / link
  string label = 2;
  repeated int64 snooze_ms = 3;  // snooze：可选的推迟时长
  string url = 4;                // link：渲染后的链接
  string next_node_name = 5;     // escalate：下一个节点
}

message TaskSummary {
  int64 id = 1;
  string task_type_key = 2;
  string task_type_name = 3;
  int32 task_type_version = 4;
  string biz_key = 5;
  TaskStatus status = 6;
  TaskPriority priority = 7;
  string assignee_id = 8;
  string node_id = 11;
  string resolution = 12;
  int64 snooze_until = 13;
  int64 created_at = 14;
  int64 updated_at = 15;
  Card card = 16;
  // 调用人可以做的操作（服务端仍会校验）
  repeated ActionOption actions = 17;
  bool can_start = 20;
}

message TaskCount {
  TaskPriority priority = 1;
  TaskStatus status = 2;
  int64 count = 3;
}

message ListTasksReq {
  string scope = 1;  // mine（默认）/ involved
  repeated TaskStatus statuses = 2;
  repeated TaskPriority priorities = 3;
  string task_type = 4;
  PageReq page = 5;
}

message ListTasksResp {
  repeated TaskSummary items = 1;
  string next_cursor = 2;
  repeated TaskCount counts = 3;  // 只在第一页返回，按 (priority, status) 分组，条件与列表相同
}

message TaskIdReq {
  int64 id = 1;
}

// 节点链上的一个节点（详情页的流程图）
message NodeView {
  string id = 1;
  string name = 2;
  string assignee = 3;  // 分配器的文字说明，如「业务关系 vip_rm（用户 UID），查不到时交给 lead@example.com」
  bool current = 4;
  bool visited = 5;
  repeated string actions = 6;
}

message HistoryItem {
  string kind = 1;  // created / started / close / no_response / snooze / escalate / woke / gone / reassigned / priority
  string actor = 2;
  string node_id = 3;
  string node_name = 4;
  TaskStatus from_status = 5;
  TaskStatus to_status = 6;
  bytes detail_json = 7;
  int64 at = 8;
}

message TaskDetail {
  TaskSummary task = 1;
  repeated KV fields = 2;  // 全部业务字段（已脱敏），按字段顺序
  repeated NodeView nodes = 3;
  repeated HistoryItem history = 4;
  bool can_reassign = 6;
  bool can_update_priority = 7;
  bool read_only = 8;  // 经手人只能查看
}

message ActTaskReq {
  int64 id = 1;
  string action = 2;     // close / no_response / snooze / escalate
  int64 snooze_ms = 3;   // snooze：必须是节点配置的选项之一
  string note = 4;
  string expect_node = 5;  // 调用人看到的节点；任务已离开该节点时拒绝，避免误操作
}

message ReassignReq {
  int64 id = 1;
  string assignee_id = 2;
  string reason = 3;
}

message UpdatePriorityReq {
  int64 id = 1;
  TaskPriority priority = 2;
}

// ============================================================================
// 推送

message PushReq {
  string task_type = 1;
  string key = 2;
  string op = 3;            // upsert / close
  int64 occurred_at = 4;    // 毫秒；比已应用的消息旧时忽略
  bytes fields_json = 5;    // upsert：业务字段
}

message PushResp {
  bool changed = 1;  // 创建或关闭了任务
}
